<div class="monster-component" [ngClass]="getShape()">
    <div class="legs">
        <div class="left-leg"></div> 
        <div class="right-leg"></div>  
    </div>
    <div class="arms">
        <div class="left-arm"></div>
        <div class="right-arm"></div>
    </div>
    <div class="body" [style.background-color]="color"></div>
    <img class="eyes" [src]="'eye' + eyeNum + '.png'" alt="Monster Eyes">
    <img class="mouth" [src]="'mouth' + mouthNum + '.png'" alt="Monster Mouth">
</div>
